name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: cocha_test
          POSTGRES_USER: cocha
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cocha -d cocha_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cocha:ci-test-only@localhost:5432/cocha_test
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --group science --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync alembic check
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/export_openapi.py
      - run: git diff --exit-code -- packages/shared/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolated Linux stack, DB tests and migration roundtrip
        shell: pwsh
        run: ./scripts/check_containers.ps1
