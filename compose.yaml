name: cocha-digital-twin

x-api: &api
  image: cocha-api:local
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
  environment:
    # Separate fields avoid password URL-encoding problems inside Compose.
    DATABASE_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:-cocha}
    POSTGRES_USER: ${POSTGRES_USER:-cocha}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    CORS_ORIGINS: '["http://localhost:3000"]'
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    GAMC_WMS_API_KEY: ${GAMC_WMS_API_KEY:-}
    MONICA_REVIEW_ENABLED: ${MONICA_REVIEW_ENABLED:-false}
    API_WRITE_TOKEN: ${API_WRITE_TOKEN:-}
    API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-}
    API_REVIEWER_TOKEN: ${API_REVIEWER_TOKEN:-}
    API_ASSISTANT_TOKEN: ${API_ASSISTANT_TOKEN:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    GEMINI_BUDGET_USD: ${GEMINI_BUDGET_USD:-4}
    GEMINI_INPUT_USD_PER_MILLION_TOKENS: ${GEMINI_INPUT_USD_PER_MILLION_TOKENS:-0.75}
    GEMINI_OUTPUT_USD_PER_MILLION_TOKENS: ${GEMINI_OUTPUT_USD_PER_MILLION_TOKENS:-3.75}
    GEMINI_PRICES_VERIFIED_ON: ${GEMINI_PRICES_VERIFIED_ON:-2026-11-14}
    GEMINI_PRICES_SOURCE_URL: ${GEMINI_PRICES_SOURCE_URL:-https://ai.google.dev/gemini-api/docs/pricing}
    GEMINI_CALLS_ENABLED: ${GEMINI_CALLS_ENABLED:-false}
    WMS_RATE_LIMIT_REQUESTS: ${WMS_RATE_LIMIT_REQUESTS:-60}
    WMS_RATE_LIMIT_WINDOW_SECONDS: ${WMS_RATE_LIMIT_WINDOW_SECONDS:-60}

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cocha}
      POSTGRES_USER: ${POSTGRES_USER:-cocha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      # Host 5432 is frequently taken by other local Postgres containers.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    volumes:
      - ./data/processed:/app/data/processed:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      API_REVIEWER_TOKEN: ${API_REVIEWER_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
