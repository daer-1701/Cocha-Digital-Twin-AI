# Isolated A01 stack: no local .env, published ports, raw data or persistent DB.
name: cocha-a01-test

x-api: &api
  image: cocha-api:a01-test
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
    target: runtime
  environment: &database
    DATABASE_HOST: db
    POSTGRES_DB: cocha_test
    POSTGRES_USER: cocha_test
    POSTGRES_PASSWORD: isolated-test-only

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      <<: *database
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cocha_test", "-d", "cocha_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20

  tests:
    profiles: ["checks"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: test
    environment:
      <<: *database
      RUN_DB_TESTS: "1"
      RUN_STACK_TESTS: "1"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
